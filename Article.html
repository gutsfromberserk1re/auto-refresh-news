<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Article | E-newspaper</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="article">
<header class="site">
  <div class="wrap bar">
    <a class="brand" href="index.html">News<span>Tok</span></a>
    <form id="search" role="search">
      <input type="search" id="q" placeholder="Search news" aria-label="Search news">
      <button type="submit">Search</button>
    </form>
  </div>
  <nav class="wrap" id="nav" aria-label="Sections"></nav>
</header>
<main class="wrap narrow">
  <article id="story"><p id="status">Loading…</p></article>
</main>
<footer class="wrap foot">Latest news</footer>
<script src="app.js"></script>
</body>
</html>
