<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NewsTok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {
    colors: { bg:'#0b1220', card:'#131c2e', line:'#25324a', text:'#c7d2e4', muted:'#7084a3', accent:'#5eead4', ad:'#101828' },
    fontFamily: {
      sans:['Inter','system-ui','sans-serif'],
      display:['Bricolage Grotesque','Inter','system-ui','sans-serif']
    }
  }}
}
</script>
<style>
  html { scroll-behavior: smooth; }
  #topbar { transition: transform .25s ease; }
  #topbar.hide { transform: translateY(-110%); }
  .line-clamp-3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  ::-webkit-scrollbar { width:8px; } ::-webkit-scrollbar-track { background:#0b1220; }
  ::-webkit-scrollbar-thumb { background:#25324a; border-radius:4px; }
  .skeleton { background:linear-gradient(90deg,#131c2e 25%,#1b2740 50%,#131c2e 75%); background-size:200% 100%; animation:sh 1.4s infinite; }
  @keyframes sh { to { background-position:-200% 0; } }
  :focus-visible { outline:2px solid #5eead4; outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body class="bg-bg text-text font-sans min-h-screen pt-24 pb-12 px-4 md:px-8 antialiased selection:bg-accent/30">

<!-- TOP BAR -->
<header id="topbar" class="fixed top-0 inset-x-0 z-40 bg-bg/90 backdrop-blur-md border-b border-line">
  <div class="max-w-7xl mx-auto flex items-center gap-4 p-3 md:p-4">
    <button id="homeBtn" class="flex items-center gap-2.5 shrink-0" aria-label="NewsTok home">
      <span class="grid place-items-center w-9 h-9 rounded-lg bg-accent text-bg font-display font-extrabold text-sm">NT</span>
      <span class="hidden sm:inline font-display font-bold text-xl text-white tracking-tight">NewsTok</span>
    </button>

    <form id="searchForm" class="flex-1 max-w-xl relative" role="search">
      <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input id="searchInput" type="search" placeholder="Search news, topics, keywords" class="w-full bg-card border border-line rounded-lg pl-10 pr-4 py-2 text-sm text-white placeholder-muted focus:border-accent focus:outline-none transition-colors">
    </form>

    <button id="refreshBtn" class="hidden sm:flex items-center gap-1.5 text-xs font-medium text-text hover:text-white bg-card hover:bg-line px-3 py-2 rounded-lg border border-line transition-colors shrink-0">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      Refresh
    </button>
  </div>
  <nav id="categoryBar" class="max-w-7xl mx-auto px-3 md:px-4 pb-3 flex gap-2 overflow-x-auto" aria-label="Categories"></nav>
</header>

<!-- LAYOUT -->
<main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
  <section class="lg:col-span-8">
    <h1 id="feedTitle" class="font-display font-bold text-2xl text-white mb-4">Top headlines</h1>
    <div id="feed" class="flex flex-col gap-5"></div>
    <div id="status" class="py-10 text-center text-sm text-muted" aria-live="polite"></div>
    <div id="sentinel" class="h-1"></div>
  </section>

  <aside class="lg:col-span-4 flex flex-col gap-5 lg:sticky lg:top-40">
    <div class="bg-card border border-line rounded-xl p-5">
      <h2 class="font-display font-bold text-white text-base mb-3 pb-3 border-b border-line">Trending topics</h2>
      <div id="trending" class="flex flex-col gap-2"></div>
    </div>
    <div class="bg-ad border border-dashed border-line rounded-xl min-h-[200px] grid place-items-center text-center p-8">
      <div><div class="font-display text-5xl font-extrabold text-muted/30">AD</div><div class="text-[11px] text-muted mt-2">Sponsored</div></div>
    </div>
  </aside>
</main>

<!-- READER -->
<div id="reader" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md overflow-y-auto p-4 md:p-8 justify-center items-start" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
  <article class="bg-card border border-line rounded-xl max-w-3xl w-full my-6 p-6 md:p-8 shadow-2xl flex flex-col gap-5">
    <div class="flex items-center justify-between border-b border-line pb-4">
      <button data-close class="text-sm text-text hover:text-white bg-bg px-3 py-1.5 rounded-lg border border-line transition-colors">Back to feed</button>
      <a id="readerLink" target="_blank" rel="noopener noreferrer" class="text-sm text-accent hover:underline underline-offset-4">Read on source site</a>
    </div>
    <div id="readerImgWrap" class="hidden w-full h-64 md:h-96 bg-bg border border-line rounded-lg overflow-hidden"><img id="readerImg" alt="" class="w-full h-full object-cover"></div>
    <div id="readerMeta" class="text-xs text-muted"></div>
    <h2 id="readerTitle" class="font-display text-2xl md:text-3xl font-bold text-white leading-tight"></h2>
    <div id="readerBody" class="text-base text-text leading-relaxed whitespace-pre-line max-w-prose"></div>
    <div class="border-t border-line pt-4 flex justify-end">
      <button data-close class="bg-accent text-bg font-semibold px-5 py-2 text-sm rounded-lg hover:brightness-110 transition">Close</button>
    </div>
  </article>
</div>

<script>
/* ---------- CONFIG ---------- */
const CATEGORIES = [
  ['general','Top'],['world','World'],['technology','Technology'],['business','Business'],
  ['science','Science'],['health','Health'],['sports','Sports'],['entertainment','Entertainment']
];
const TRENDING = [['🌌','AI Breakthrough'],['🌍','Climate Action'],['🚀','New Space Mission']];
const AD_EVERY = 5;

/* ---------- STATE ---------- */
const state = { query:'', category:'general', page:1, loading:false, done:false, articles:[], seen:new Set(), rendered:0, usingFallback:false };
const $ = id => document.getElementById(id);
const feed = $('feed'), statusEl = $('status');

/* ---------- HELPERS ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function timeAgo(iso) {
  const t = Date.parse(iso); if (!t) return '';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60); if (h < 24) return h + ' h ago';
  return Math.round(h / 24) + ' d ago';
}
const metaLine = a => [a.source?.name, timeAgo(a.publishedAt)].filter(Boolean).join(' • ');

/* ---------- DATA ---------- */
async function fromApi() {
  const p = new URLSearchParams({ q: state.query, category: state.category, page: state.page });
  const r = await fetch('/api/news?' + p);
  if (!r.ok) throw new Error('api ' + r.status);
  return r.json();
}
async function fromRss() {
  const r = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://techcrunch.com/feed/');
  const d = await r.json();
  return d.items.map(i => ({
    title: i.title,
    description: i.description.replace(/<[^>]*>?/gm, ''),
    content: i.content ? i.content.replace(/<[^>]*>?/gm, '') : i.description.replace(/<[^>]*>?/gm, ''),
    url: i.link, image: i.thumbnail || i.enclosure?.link || null,
    publishedAt: i.pubDate, source: { name: 'TechCrunch' }
  }));
}
async function fetchArticles() {
  if (!state.usingFallback) {
    try { return await fromApi(); } catch (e) { console.warn('News API failed:', e); }
    state.usingFallback = true;
  }
  if (state.page === 1) {
    try { return await fromRss(); } catch (e) { console.warn('RSS failed:', e); }
    return mockArticles();
  }
  return [];
}

/* ---------- RENDER ---------- */
function skeletons(n = 3) {
  feed.insertAdjacentHTML('beforeend', Array.from({length:n}, () =>
    `<div class="sk skeleton h-44 rounded-xl border border-line"></div>`).join(''));
}
function adCard() {
  const d = document.createElement('div');
  d.className = 'bg-ad border border-dashed border-line rounded-xl min-h-[120px] grid place-items-center text-center p-6';
  d.innerHTML = '<div><div class="font-display text-3xl font-extrabold text-muted/30">AD</div><div class="text-[11px] text-muted mt-1">Sponsored</div></div>';
  return d;
}
function thumb(a) {
  const wrap = document.createElement('div');
  wrap.className = 'w-full sm:w-5/12 h-44 sm:h-auto min-h-[140px] bg-ad border border-line rounded-lg overflow-hidden shrink-0 grid place-items-center';
  const placeholder = () => { wrap.innerHTML = '<span class="font-display text-3xl font-extrabold text-muted/30 select-none">NT</span>'; };
  if (!a.image) { placeholder(); return wrap; }
  const img = new Image();
  img.src = a.image; img.alt = ''; img.loading = 'lazy';
  img.className = 'w-full h-full object-cover';
  img.onerror = placeholder;
  wrap.appendChild(img);
  return wrap;
}
function renderArticles(list) {
  document.querySelectorAll('.sk').forEach(e => e.remove());
  list.forEach(a => {
    const idx = state.articles.push(a) - 1;
    const card = document.createElement('article');
    card.className = 'bg-card border border-line rounded-xl p-5 hover:border-accent/50 transition-colors flex flex-col sm:flex-row gap-5 cursor-pointer';
    card.tabIndex = 0;
    card.appendChild(thumb(a));
    const body = document.createElement('div');
    body.className = 'flex flex-col justify-between flex-1 gap-3';
    body.innerHTML = `
      <div>
        <div class="text-xs text-muted mb-1.5">${esc(metaLine(a))}</div>
        <h2 class="font-display text-lg md:text-xl font-bold text-white leading-snug mb-2">${esc(a.title)}</h2>
        <p class="text-sm text-text leading-relaxed line-clamp-3">${esc(a.description || a.content || '')}</p>
      </div>
      <span class="self-start text-xs font-semibold text-accent">Read more</span>`;
    card.appendChild(body);
    const open = () => openReader(idx);
    card.addEventListener('click', open);
    card.addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
    feed.appendChild(card);
    if (++state.rendered % AD_EVERY === 0) feed.appendChild(adCard());
  });
}

/* ---------- LOADING ---------- */
async function load() {
  if (state.loading || state.done) return;
  state.loading = true; statusEl.textContent = '';
  skeletons(state.page === 1 ? 4 : 2);

  const incoming = await fetchArticles();
  const fresh = incoming.filter(a => a.url && !state.seen.has(a.url));
  fresh.forEach(a => state.seen.add(a.url));

  if (!fresh.length) {
    state.done = true;
    document.querySelectorAll('.sk').forEach(e => e.remove());
    statusEl.textContent = state.rendered
      ? "You're all caught up."
      : 'No stories found. Try a different search or category.';
  } else {
    renderArticles(fresh);
    state.page++;
    if (state.usingFallback) { state.done = true; statusEl.textContent = 'Live news is unavailable right now, showing backup stories.'; }
  }
  state.loading = false;
}
function reset({ query = '', category = 'general' } = {}) {
  Object.assign(state, { query, category, page:1, loading:false, done:false, articles:[], seen:new Set(), rendered:0, usingFallback:false });
  feed.innerHTML = ''; statusEl.textContent = '';
  $('feedTitle').textContent = query ? `Results for “${query}”` : (CATEGORIES.find(c => c[0] === category)?.[1] || 'Top') + ' headlines';
  $('searchInput').value = query;
  drawCategories();
  window.scrollTo({ top: 0 });
  load();
}

/* ---------- READER ---------- */
function openReader(i) {
  const a = state.articles[i]; if (!a) return;
  $('readerTitle').textContent = a.title;
  $('readerMeta').textContent = metaLine(a);
  $('readerBody').textContent = a.content || a.description || 'The full story is available on the source site.';
  $('readerLink').href = a.url || '#';
  const wrap = $('readerImgWrap');
  if (a.image) { $('readerImg').src = a.image; wrap.classList.remove('hidden'); } else wrap.classList.add('hidden');
  $('reader').classList.remove('hidden'); $('reader').classList.add('flex');
  document.body.style.overflow = 'hidden';
}
function closeReader() {
  $('reader').classList.add('hidden'); $('reader').classList.remove('flex');
  document.body.style.overflow = '';
}

/* ---------- UI WIRING ---------- */
function drawCategories() {
  $('categoryBar').innerHTML = CATEGORIES.map(([id, label]) => {
    const active = !state.query && state.category === id;
    return `<button data-cat="${id}" class="shrink-0 text-xs font-medium px-3 py-1.5 rounded-full border transition-colors ${active ? 'bg-accent text-bg border-accent' : 'bg-card text-text border-line hover:border-accent/60'}">${label}</button>`;
  }).join('');
}
$('categoryBar').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (b) reset({ category: b.dataset.cat }); });
$('trending').innerHTML = TRENDING.map(([emoji, t]) =>
  `<button data-topic="${esc(t)}" class="text-left p-3 rounded-lg bg-bg hover:bg-line/60 border border-line text-sm font-medium text-white transition-colors flex items-center gap-3"><span>${emoji}</span>${esc(t)}</button>`).join('');
$('trending').addEventListener('click', e => { const b = e.target.closest('[data-topic]'); if (b) reset({ query: b.dataset.topic }); });
$('searchForm').addEventListener('submit', e => { e.preventDefault(); const q = $('searchInput').value.trim(); if (q) reset({ query: q }); });
$('homeBtn').addEventListener('click', () => reset());
$('refreshBtn').addEventListener('click', () => reset({ query: state.query, category: state.category }));
$('reader').addEventListener('click', e => { if (e.target === $('reader') || e.target.closest('[data-close]')) closeReader(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeReader(); });

/* auto-hide header + infinite scroll */
let lastY = 0;
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  $('topbar').classList.toggle('hide', y > lastY && y > 120);
  lastY = Math.max(y, 0);
}, { passive: true });
new IntersectionObserver(es => { if (es[0].isIntersecting) load(); }, { rootMargin: '500px' }).observe($('sentinel'));

/* ---------- MOCK DATA (last resort) ---------- */
function mockArticles() {
  const m = [
    ['Satlyt raises $8M to run AI on satellites','Satlyt wants to be the Android of orbital computing, offering open software that works on many companies\' satellites.'],
    ['Google releases its most powerful Gemini model yet','The new model is pitched as a workhorse for coding and cybersecurity work.'],
    ['Pentagon taps tech leaders to study the future of warfare','The panel will examine autonomous systems and modern defense software.'],
    ['Quantum computing breakthrough promises fault-tolerant scaling','Researchers demonstrate error correction operating above fault-tolerance thresholds.'],
    ['Climate summit reaches deal on renewable grid funding','Delegates approve provisions for grid interconnectivity and clean energy storage.'],
    ['Rover finds ancient geological signatures on Mars','Spectral analysis reveals sediment compositions consistent with lake bed deposits.']
  ];
  return m.map(([title, description], i) => ({ title, description, content: description, url: 'https://news.google.com/?mock=' + i, image: null, source: { name: 'Sample' } }));
}

/* ---------- START ---------- */
drawCategories();
load();
</script>
</body>
</html>
