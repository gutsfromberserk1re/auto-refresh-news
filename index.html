<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Feed Aggregator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        wireBg: '#0f172a',
                        wireCard: '#1e293b',
                        wireBorder: '#334155',
                        wireText: '#cbd5e1',
                        wireMuted: '#64748b',
                        wireAd: '#182232'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* Smooth transition for auto-hiding floating header */
        #floatingHeader {
            transition: transform 0.25s ease-in-out;
        }
        .header-hidden {
            transform: translateY(-110%);
        }
        .header-visible {
            transform: translateY(0);
        }

        /* Custom subtle scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="bg-wireBg text-wireText font-sans min-h-screen pt-20 pb-12 px-4 md:px-8 antialiased selection:bg-slate-700 selection:text-white">

    <!-- FLOATING AUTO-HIDING SEARCH HEADER -->
    <header id="floatingHeader" class="fixed top-0 left-0 right-0 z-40 p-3 md:p-4 header-visible bg-wireBg/95 backdrop-blur-md border-b border-wireBorder/80 shadow-lg">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            
            <!-- Logo / Brand Title -->
            <div onclick="resetFeed()" class="cursor-pointer font-bold text-lg md:text-xl text-white flex items-center gap-2 select-none shrink-0">
                <span class="bg-slate-800 text-slate-100 border border-wireBorder px-2.5 py-1 rounded-md font-extrabold text-sm tracking-wider">NT</span>
                <span class="hidden sm:inline tracking-tight text-slate-100">NewsTok</span>
            </div>

            <!-- Search Bar (Floating & Auto-Hiding) -->
            <div class="flex-1 max-w-xl relative">
                <input 
                    type="text" 
                    id="searchInput"
                    placeholder="Search news, topics, keywords..." 
                    class="w-full bg-wireCard border border-wireBorder rounded-lg px-4 py-2 pl-10 text-sm text-slate-100 placeholder-wireMuted focus:outline-none focus:border-slate-400 shadow-inner transition-colors"
                    onkeypress="handleSearchKeypress(event)"
                >
                <button onclick="executeSearch()" class="absolute left-3 top-2.5 text-wireMuted hover:text-white transition-colors" aria-label="Search">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </button>
            </div>

            <!-- Refresh Button -->
            <button onclick="resetFeed()" class="hidden sm:flex text-xs font-medium text-slate-300 hover:text-white bg-wireCard hover:bg-slate-700 px-3 py-2 rounded-lg border border-wireBorder transition-all items-center gap-1.5 shrink-0">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                Refresh
            </button>
        </div>
    </header>

    <!-- MAIN APPLICATION GRID -->
    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

        <!-- LEFT COLUMN: Main News Feed Article Stream -->
        <section class="lg:col-span-8 flex flex-col gap-5" id="mainNewsFeed">
            <!-- News Article Cards & In-Feed Native Ads injected dynamically -->
        </section>

        <!-- RIGHT COLUMN: Trending Topics + AD Banner -->
        <aside class="lg:col-span-4 flex flex-col gap-5 sticky top-24">
            
            <!-- TOP RIGHT: Trending Topic Section -->
            <div class="bg-wireCard border border-wireBorder rounded-xl p-5 shadow-sm">
                <h3 class="font-bold text-slate-100 text-sm tracking-wide uppercase mb-3 pb-2 border-b border-wireBorder flex items-center justify-between">
                    <span>Trending Topic</span>
                    <span class="text-[11px] font-normal normal-case text-wireMuted">Live Feed</span>
                </h3>
                <div class="flex flex-col gap-2.5 text-sm" id="trendingList">
                    <button onclick="clickTrending('AI Breakthrough')" class="text-left p-3 rounded-lg bg-wireBg hover:bg-slate-800 border border-wireBorder/60 text-slate-200 hover:text-white transition-all flex items-center gap-3 group">
                        <span class="text-base">🌌</span>
                        <span class="font-medium text-slate-200 group-hover:text-white">Trending: AI Breakthrough</span>
                    </button>
                    <button onclick="clickTrending('Climate Action')" class="text-left p-3 rounded-lg bg-wireBg hover:bg-slate-800 border border-wireBorder/60 text-slate-200 hover:text-white transition-all flex items-center gap-3 group">
                        <span class="text-base">🌍</span>
                        <span class="font-medium text-slate-200 group-hover:text-white">Trending: Climate Action</span>
                    </button>
                    <button onclick="clickTrending('New Space Mission')" class="text-left p-3 rounded-lg bg-wireBg hover:bg-slate-800 border border-wireBorder/60 text-slate-200 hover:text-white transition-all flex items-center gap-3 group">
                        <span class="text-base">🚀</span>
                        <span class="font-medium text-slate-200 group-hover:text-white">Trending: New Space Mission</span>
                    </button>
                </div>
            </div>

            <!-- BOTTOM RIGHT: Permanent Sidebar AD Block -->
            <div class="bg-wireAd border border-wireBorder rounded-xl p-8 min-h-[200px] flex flex-col items-center justify-center text-center shadow-sm relative overflow-hidden group hover:border-slate-500 transition-colors">
                <div class="text-5xl font-black text-wireMuted/30 group-hover:text-wireMuted/50 transition-colors tracking-widest select-none">AD</div>
                <span class="text-[10px] text-wireMuted uppercase tracking-widest mt-2 font-medium">Sponsored Advertisement</span>
            </div>

        </aside>

    </main>

    <!-- FULL ARTICLE READER OVERLAY -->
    <div id="articleModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md overflow-y-auto p-4 md:p-8 flex justify-center items-start">
        <div class="bg-wireCard border border-wireBorder rounded-xl max-w-4xl w-full my-6 p-6 md:p-8 shadow-2xl relative text-slate-200 flex flex-col gap-6">
            
            <!-- Modal Header / Controls -->
            <div class="flex items-center justify-between border-b border-wireBorder pb-4">
                <button onclick="closeArticleModal()" class="flex items-center gap-2 text-xs md:text-sm text-slate-300 hover:text-white bg-wireBg px-3 py-1.5 rounded-lg border border-wireBorder transition-colors font-medium">
                    <span>←</span> Back to Feed
                </button>
                <a id="modalExternalLink" href="#" target="_blank" rel="noopener" class="text-xs md:text-sm text-slate-300 hover:text-white underline underline-offset-4 font-medium">
                    Open Original Source ↗
                </a>
            </div>

            <!-- Article Hero Image -->
            <div id="modalImageContainer" class="w-full h-64 md:h-96 bg-wireBg border border-wireBorder rounded-lg overflow-hidden hidden">
                <img id="modalImage" src="" alt="Article thumbnail" class="w-full h-full object-cover">
            </div>

            <!-- Article Title -->
            <h1 id="modalTitle" class="text-2xl md:text-3xl font-bold text-white leading-tight"></h1>

            <!-- Article Content Body -->
            <div id="modalBody" class="text-sm md:text-base text-wireText leading-relaxed whitespace-pre-line border-t border-wireBorder pt-4"></div>

            <!-- Article Reader Footer -->
            <div class="border-t border-wireBorder pt-4 flex justify-end items-center">
                <button onclick="closeArticleModal()" class="bg-slate-100 text-slate-900 font-semibold px-5 py-2 text-sm rounded-lg hover:bg-slate-200 transition-colors">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="py-10 flex justify-center items-center">
        <div class="w-7 h-7 border-2 border-wireMuted border-t-white rounded-full animate-spin"></div>
    </div>

    <script>
        // Key Array Rotation
        const gnewsKeys = [
            "c12f5f05120277c8472ceb2a50af4b12",
            "YOUR_GNEWS_KEY_2",
            "YOUR_GNEWS_KEY_3"
        ];

        // Fallback Feed Configuration
        const backupApis = [
            {
                fetcher: async () => {
                    const res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=https://techcrunch.com/feed/");
                    const data = await res.json();
                    return data.items.map(item => ({
                        title: item.title,
                        description: item.description.replace(/<[^>]*>?/gm, ''),
                        content: item.content || item.description.replace(/<[^>]*>?/gm, ''),
                        url: item.link,
                        image: item.thumbnail || item.enclosure?.link || null
                    }));
                }
            }
        ];

        let activeKeyIndex = 0;
        let currentSearchQuery = '';
        let isFetching = false;
        let totalItemsRendered = 0;
        let articlesStore = [];

        // Auto-Hide Header State Logic
        let lastScrollTop = 0;
        const floatingHeader = document.getElementById('floatingHeader');

        window.addEventListener('DOMContentLoaded', () => {
            loadArticles();

            window.addEventListener('scroll', () => {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

                if (scrollTop > lastScrollTop && scrollTop > 80) {
                    floatingHeader.classList.remove('header-visible');
                    floatingHeader.classList.add('header-hidden');
                } else if (scrollTop < lastScrollTop) {
                    floatingHeader.classList.remove('header-hidden');
                    floatingHeader.classList.add('header-visible');
                }
                lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;

                // Infinite scroll handler
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 450 && !isFetching) {
                    loadArticles();
                }
            });
        });

        async function fetchNewsData(query = '') {
            const hasValidGNewsKeys = gnewsKeys.length > 0 && !gnewsKeys[0].includes("YOUR_GNEWS_KEY");

            if (hasValidGNewsKeys) {
                const currentKey = gnewsKeys[activeKeyIndex];
                const endpoint = query 
                    ? `https://gnews.io/api/v4/search?q=${encodeURIComponent(query)}&lang=en&max=10&apikey=${currentKey}`
                    : `https://gnews.io/api/v4/top-headlines?category=general&lang=en&max=10&apikey=${currentKey}`;

                try {
                    const response = await fetch(endpoint);

                    if (response.status === 429 || response.status === 401) {
                        activeKeyIndex = (activeKeyIndex + 1) % gnewsKeys.length;
                        return fetchNewsData(query);
                    }

                    if (!response.ok) throw new Error("GNews error");

                    const data = await response.json();
                    return data.articles || [];
                } catch (err) {}
            }

            if (backupApis.length > 0) {
                try {
                    return await backupApis[0].fetcher();
                } catch (backupErr) {}
            }

            return getWireframeMockArticles();
        }

        async function loadArticles() {
            if (isFetching) return;
            isFetching = true;
            document.getElementById('loadingSpinner').style.display = 'flex';

            const articles = await fetchNewsData(currentSearchQuery);
            articlesStore = [...articlesStore, ...articles];
            renderArticles(articles);

            isFetching = false;
            document.getElementById('loadingSpinner').style.display = 'none';
        }

        function renderArticles(articles) {
            const feedContainer = document.getElementById('mainNewsFeed');

            if (articles.length === 0 && totalItemsRendered === 0) {
                feedContainer.innerHTML = `
                    <div class="p-8 text-center text-wireMuted bg-wireCard border border-wireBorder rounded-xl">
                        No articles found. Try searching for another topic.
                    </div>`;
                return;
            }

            articles.forEach((article) => {
                const globalIndex = articlesStore.length - articles.length + articles.indexOf(article);
                totalItemsRendered++;

                const card = document.createElement('article');
                card.className = "bg-wireCard border border-wireBorder rounded-xl p-5 shadow-sm hover:border-slate-500 transition-all flex flex-col sm:flex-row gap-5 items-stretch cursor-pointer";
                card.onclick = (e) => {
                    if (!e.target.closest('a')) {
                        openArticleReader(globalIndex);
                    }
                };

                // Left block image or AD placeholder block
                const leftBlockHtml = article.image 
                    ? `<div class="w-full sm:w-5/12 h-44 sm:h-auto min-h-[140px] bg-wireBg border border-wireBorder rounded-lg overflow-hidden shrink-0 relative group">
                         <img src="${article.image}" alt="Article thumbnail" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.parentElement.outerHTML='<div class=\\'w-full sm:w-5/12 min-h-[140px] bg-wireAd border border-wireBorder rounded-lg flex items-center justify-center font-black text-3xl text-wireMuted/40 shrink-0 select-none\\'>AD</div>'">
                       </div>`
                    : `<div class="w-full sm:w-5/12 min-h-[140px] bg-wireAd border border-wireBorder rounded-lg flex items-center justify-center font-black text-3xl text-wireMuted/40 shrink-0 select-none">
                        AD
                       </div>`;

                card.innerHTML = `
                    ${leftBlockHtml}
                    <div class="flex flex-col justify-between flex-1 py-0.5 gap-2.5">
                        <div>
                            <h2 class="text-lg md:text-xl font-bold text-slate-100 leading-snug mb-2 hover:text-white transition-colors">
                                ${article.title}
                            </h2>
                            <p class="text-xs md:text-sm text-wireText leading-relaxed line-clamp-3">
                                ${article.description || article.content || 'Click read more to view the full story...'}
                            </p>
                        </div>
                        <button onclick="openArticleReader(${globalIndex})" class="self-start text-xs font-semibold text-slate-300 hover:text-white underline underline-offset-4 decoration-wireMuted hover:decoration-white transition-all">
                            read more
                        </button>
                    </div>
                `;

                feedContainer.appendChild(card);

                // INJECT A NATIVE FEED AD CARD EVERY 5 POSTS
                if (totalItemsRendered % 5 === 0) {
                    const adCard = document.createElement('div');
                    adCard.className = "bg-wireAd border border-wireBorder rounded-xl p-6 shadow-sm flex flex-col items-center justify-center text-center my-1 hover:border-slate-500 transition-colors min-h-[140px]";
                    adCard.innerHTML = `
                        <div class="text-4xl font-black text-wireMuted/30 tracking-widest select-none">AD</div>
                        <span class="text-[10px] text-wireMuted uppercase tracking-widest mt-1.5 font-medium">Sponsored Native Stream Banner</span>
                    `;
                    feedContainer.appendChild(adCard);
                }
            });
        }

        function openArticleReader(index) {
            const article = articlesStore[index];
            if (!article) return;

            document.getElementById('modalTitle').innerText = article.title;
            
            const fullText = article.content || article.description || "Full story content is available at the source article link.";
            document.getElementById('modalBody').innerText = fullText;

            document.getElementById('modalExternalLink').href = article.url || "#";

            const imgContainer = document.getElementById('modalImageContainer');
            const imgEl = document.getElementById('modalImage');
            if (article.image) {
                imgEl.src = article.image;
                imgContainer.classList.remove('hidden');
            } else {
                imgContainer.classList.add('hidden');
            }

            document.getElementById('articleModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeArticleModal() {
            document.getElementById('articleModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function handleSearchKeypress(e) {
            if (e.key === 'Enter') executeSearch();
        }

        function executeSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                currentSearchQuery = query;
                resetAndReload();
            }
        }

        function clickTrending(topic) {
            document.getElementById('searchInput').value = topic;
            currentSearchQuery = topic;
            resetAndReload();
        }

        function resetFeed() {
            document.getElementById('searchInput').value = '';
            currentSearchQuery = '';
            resetAndReload();
        }

        function resetAndReload() {
            totalItemsRendered = 0;
            articlesStore = [];
            document.getElementById('mainNewsFeed').innerHTML = '';
            loadArticles();
        }

        function getWireframeMockArticles() {
            return [
                {
                    title: "Satlyt, founded by a former Google and SpaceX product manager, raises $8M to run AI on satellites",
                    description: "Satlyt wants to be the Android of orbital computing, offering open software that works on many companies' satellites, versus SpaceX's closed, all-in-one iPhone-style approach.",
                    content: "Satlyt wants to be the Android of orbital computing, offering open software that works on many companies' satellites, versus SpaceX's closed, all-in-one iPhone-style approach.\n\nThe startup plans to deploy edge computing units directly on satellites in low Earth orbit to enable faster on-board inference for satellite imagery and remote sensing data.",
                    url: "https://news.google.com",
                    image: null
                },
                {
                    title: "Google releases Gemini 4 Argon, called its most powerful model yet",
                    description: "Google has released its latest Gemini model, marketing it as a workhorse for coding and cybersecurity work.",
                    content: "Google has released its latest Gemini model, marketing it as a workhorse for coding and cybersecurity work. The new architecture improves long-context reasoning and reduces hallucination rates across complex tasks.",
                    url: "https://news.google.com",
                    image: null
                },
                {
                    title: "The Pentagon taps Elon Musk and Palmer Luckey to help decide what the military should do next",
                    description: "Defense Secretary Pete Hegseth launched a study on the future of warfare led by technology industry leaders.",
                    content: "Defense Secretary Pete Hegseth launched a study on the future of warfare led by technology industry leaders. The panel will examine autonomous systems, algorithmic decision-making, and modern defense software architectures.",
                    url: "https://news.google.com",
                    image: null
                },
                {
                    title: "Quantum computing breakthrough promises fault-tolerant qubit scaling",
                    description: "Researchers demonstrate a novel error correction topological surface code operating above fault-tolerance thresholds.",
                    content: "Researchers demonstrate a novel error correction topological surface code operating above fault-tolerance thresholds. This milestone paves the way for commercial scale fault-tolerant quantum hardware within the decade.",
                    url: "https://news.google.com",
                    image: null
                },
                {
                    title: "Global climate summit reaches consensus on renewable grid integration funding",
                    description: "Delegates approve key provisions for international grid interconnectivity and clean energy storage investment pools.",
                    content: "Delegates approve key provisions for international grid interconnectivity and clean energy storage investment pools, unlocking billions in international climate action funding.",
                    url: "https://news.google.com",
                    image: null
                },
                {
                    title: "Autonomous exploration rover discovers ancient geological signatures on Mars",
                    description: "Spectral analysis reveals sediment compositions consistent with long-duration organic lake bed deposits.",
                    content: "Spectral analysis reveals sediment compositions consistent with long-duration organic lake bed deposits. Robotic core samples are slated for future sample return missions.",
                    url: "https://news.google.com",
                    image: null
                }
            ];
        }
    </script>
</body>
</html>
