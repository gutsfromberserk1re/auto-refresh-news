<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Newspaper</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
<header class="site">
  <div class="wrap bar">
    <a class="brand" href="index.html">E-News<span>Paper</span></a>
    <form id="search" role="search">
      <input type="search" id="q" placeholder="Search news" aria-label="Search news">
      <button type="submit">Search</button>
    </form>
  </div>
  <nav class="wrap" id="nav" aria-label="Sections"></nav>
</header>
<main class="wrap">
  <h1 id="title" class="section-title"></h1>
  <div id="content"></div>
  <p id="status" aria-live="polite"></p>
</main>
<footer class="wrap foot">latest news</footer>
<script src="app.js"></script>
</body>
</html>
