<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Feed Aggregator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        wireBg: '#181c24',
                        wireCard: '#222834',
                        wireBorder: '#323a4a',
                        wireText: '#d8deee',
                        wireMuted: '#64748b',
                        wireAd: '#1c222e'
                    },
                    fontFamily: {
                        mono: ['Courier New', 'Consolas', 'monospace'],
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* Smooth transition for auto-hiding floating header */
        #floatingHeader {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .header-hidden {
            transform: translateY(-120%);
        }
        .header-visible {
            transform: translateY(0);
        }

        /* Custom scrollbar matching wireframe theme */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #181c24;
        }
        ::-webkit-scrollbar-thumb {
            background: #323a4a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="bg-wireBg text-wireText font-sans min-h-screen pt-20 pb-12 px-3 md:px-8 selection:bg-slate-700 selection:text-white">

    <!-- FLOATING AUTO-HIDING SEARCH HEADER -->
    <header id="floatingHeader" class="fixed top-0 left-0 right-0 z-40 p-3 md:p-4 header-visible bg-wireBg/90 backdrop-blur-md border-b border-wireBorder/60 shadow-2xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            
            <!-- Logo / Brand Title -->
            <div onclick="resetFeed()" class="cursor-pointer font-mono font-bold text-lg md:text-xl text-white flex items-center gap-2">
                <span class="bg-slate-800 text-slate-100 border border-wireBorder px-2.5 py-1 rounded-md">NT</span>
                <span class="hidden sm:inline tracking-tight">NewsTok</span>
            </div>

            <!-- Search Bar (Floating & Auto-Hiding) -->
            <div class="flex-1 max-w-xl relative">
                <input 
                    type="text" 
                    id="searchInput"
                    placeholder="Search news, topics, keywords..." 
                    class="w-full bg-wireCard border border-wireBorder rounded-xl px-4 py-2.5 pl-10 text-sm font-mono text-white placeholder-wireMuted focus:outline-none focus:border-slate-400 shadow-inner transition-colors"
                    onkeypress="handleSearchKeypress(event)"
                >
                <button onclick="executeSearch()" class="absolute left-3 top-3 text-wireMuted hover:text-white transition-colors">
                    <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </button>
            </div>

            <!-- Clear / Refresh Button -->
            <button onclick="resetFeed()" class="hidden sm:flex text-xs font-mono text-slate-300 hover:text-white bg-wireCard hover:bg-wireBorder px-3 py-2 rounded-lg border border-wireBorder transition-all items-center gap-1.5">
                <span>🔄</span> Refresh
            </button>
        </div>
    </header>

    <!-- MAIN APPLICATION GRID -->
    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

        <!-- LEFT COLUMN: Main News Feed Article Stream -->
        <section class="lg:col-span-8 flex flex-col gap-6" id="mainNewsFeed">
            <!-- News Article Cards injected dynamically -->
        </section>

        <!-- RIGHT COLUMN: Trending Topics + AD Banner -->
        <aside class="lg:col-span-4 flex flex-col gap-6 sticky top-24">
            
            <!-- TOP RIGHT: Trending Topic Section -->
            <div class="bg-wireCard border border-wireBorder rounded-2xl p-5 shadow-2xl">
                <h3 class="font-mono font-bold text-slate-100 text-lg mb-4 border-b border-wireBorder pb-3 flex items-center justify-between">
                    <span>Trending Topic</span>
                    <span class="text-xs font-normal text-wireMuted">Live Feed</span>
                </h3>
                <div class="flex flex-col gap-3 font-mono text-sm" id="trendingList">
                    <button onclick="clickTrending('AI Breakthrough')" class="text-left p-3.5 rounded-xl bg-wireBg hover:bg-slate-800 border border-wireBorder/60 text-wireText hover:text-white transition-all flex items-center gap-3 group">
                        <span class="text-base group-hover:scale-110 transition-transform">🌌</span>
                        <span class="font-semibold text-slate-200 group-hover:text-white">Trending: AI Breakthrough</span>
                    </button>
                    <button onclick="clickTrending('Climate Action')" class="text-left p-3.5 rounded-xl bg-wireBg hover:bg-slate-800 border border-wireBorder/60 text-wireText hover:text-white transition-all flex items-center gap-3 group">
                        <span class="text-base group-hover:scale-110 transition-transform">🌍</span>
                        <span class="font-semibold text-slate-200 group-hover:text-white">Trending: Climate Action</span>
                    </button>
                    <button onclick="clickTrending('New Space Mission')" class="text-left p-3.5 rounded-xl bg-wireBg hover:bg-slate-800 border border-wireBorder/60 text-wireText hover:text-white transition-all flex items-center gap-3 group">
                        <span class="text-base group-hover:scale-110 transition-transform">🚀</span>
                        <span class="font-semibold text-slate-200 group-hover:text-white">Trending: New Space Mission</span>
                    </button>
                </div>
            </div>

            <!-- BOTTOM RIGHT: Permanent AD Block -->
            <div class="bg-wireAd border border-wireBorder rounded-2xl p-8 min-h-[220px] flex flex-col items-center justify-center text-center shadow-2xl relative overflow-hidden group hover:border-slate-500 transition-colors">
                <div class="text-6xl font-mono font-black text-wireMuted/40 group-hover:text-wireMuted/70 transition-colors tracking-widest">AD</div>
                <span class="text-xs font-mono text-wireMuted uppercase tracking-widest mt-2">Sponsored Advertisement</span>
            </div>

        </aside>

    </main>

    <!-- FULL ARTICLE READER OVERLAY (Renders when user clicks 'read more' or article card) -->
    <div id="articleModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md overflow-y-auto p-4 md:p-8 flex justify-center items-start">
        <div class="bg-wireCard border border-wireBorder rounded-2xl max-w-4xl w-full my-6 p-6 md:p-10 shadow-2xl relative font-mono text-slate-200 flex flex-col gap-6">
            
            <!-- Modal Header / Controls -->
            <div class="flex items-center justify-between border-b border-wireBorder pb-4">
                <button onclick="closeArticleModal()" class="flex items-center gap-2 text-xs md:text-sm text-wireMuted hover:text-white bg-wireBg px-3 py-1.5 rounded-lg border border-wireBorder transition-colors">
                    <span>←</span> Back to Feed
                </button>
                <a id="modalExternalLink" href="#" target="_blank" class="text-xs md:text-sm text-slate-300 hover:text-white underline underline-offset-4">
                    Open Original Source ↗
                </a>
            </div>

            <!-- Article Hero Image -->
            <div id="modalImageContainer" class="w-full h-64 md:h-96 bg-wireBg border border-wireBorder rounded-xl overflow-hidden hidden">
                <img id="modalImage" src="" alt="Article hero" class="w-full h-full object-cover">
            </div>

            <!-- Article Title -->
            <h1 id="modalTitle" class="text-2xl md:text-4xl font-bold text-white leading-tight"></h1>

            <!-- Article Content Body -->
            <div id="modalBody" class="text-sm md:text-base text-wireText leading-relaxed whitespace-pre-line border-t border-wireBorder pt-4"></div>

            <!-- Article Reader Footer -->
            <div class="border-t border-wireBorder pt-6 flex justify-between items-center text-xs text-wireMuted">
                <span>NewsTok Reader Engine</span>
                <button onclick="closeArticleModal()" class="bg-slate-100 text-slate-900 font-bold px-5 py-2 rounded-xl hover:bg-slate-300 transition-colors">
                    Close Article
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="py-10 flex justify-center items-center">
        <div class="w-8 h-8 border-3 border-wireMuted border-t-white rounded-full animate-spin"></div>
    </div>

    <script>
        // Multi-Account Keys Array (Fill with your 15 accounts)
        const gnewsKeys = [
            "YOUR_GNEWS_KEY_1",
            "YOUR_GNEWS_KEY_2",
            "YOUR_GNEWS_KEY_3"
        ];

        // Backup API Configuration
        const backupApis = [
            {
                name: "RSS Tech Feed Bridge",
                fetcher: async () => {
                    const res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=https://techcrunch.com/feed/");
                    const data = await res.json();
                    return data.items.map(item => ({
                        title: item.title,
                        description: item.description.replace(/<[^>]*>?/gm, ''),
                        content: item.content || item.description.replace(/<[^>]*>?/gm, ''),
                        url: item.link,
                        image: item.thumbnail || item.enclosure?.link || null
                    }));
                }
            }
        ];

        let activeKeyIndex = 0;
        let currentSearchQuery = '';
        let isFetching = false;
        let totalItemsRendered = 0;
        let articlesStore = [];

        // Auto-Hide Header State
        let lastScrollTop = 0;
        const floatingHeader = document.getElementById('floatingHeader');

        window.addEventListener('DOMContentLoaded', () => {
            loadArticles();

            // Auto-hiding header scroll detection
            window.addEventListener('scroll', () => {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

                if (scrollTop > lastScrollTop && scrollTop > 80) {
                    floatingHeader.classList.remove('header-visible');
                    floatingHeader.classList.add('header-hidden');
                } else if (scrollTop < lastScrollTop) {
                    floatingHeader.classList.remove('header-hidden');
                    floatingHeader.classList.add('header-visible');
                }
                lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;

                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 450 && !isFetching) {
                    loadArticles();
                }
            });
        });

        async function fetchNewsData(query = '') {
            const hasValidGNewsKeys = gnewsKeys.length > 0 && !gnewsKeys[0].includes("YOUR_GNEWS_KEY");

            if (hasValidGNewsKeys) {
                const currentKey = gnewsKeys[activeKeyIndex];
                const endpoint = query 
                    ? `https://gnews.io/api/v4/search?q=${encodeURIComponent(query)}&lang=en&max=10&apikey=${currentKey}`
                    : `https://gnews.io/api/v4/top-headlines?category=general&lang=en&max=10&apikey=${currentKey}`;

                try {
                    const response = await fetch(endpoint);

                    if (response.status === 429 || response.status === 401) {
                        activeKeyIndex = (activeKeyIndex + 1) % gnewsKeys.length;
                        return fetchNewsData(query);
                    }

                    if (!response.ok) throw new Error("GNews fetch failed");

                    const data = await response.json();
                    return data.articles || [];
                } catch (err) {}
            }

            if (backupApis.length > 0) {
                try {
                    return await backupApis[0].fetcher();
                } catch (backupErr) {}
            }

            return getWireframeMockArticles();
        }

        async function loadArticles() {
            if (isFetching) return;
            isFetching = true;
            document.getElementById('loadingSpinner').style.display = 'flex';

            const articles = await fetchNewsData(currentSearchQuery);
            articlesStore = [...articlesStore, ...articles];
            renderArticles(articles);

            isFetching = false;
            document.getElementById('loadingSpinner').style.display = 'none';
        }

        function renderArticles(articles) {
            const feedContainer = document.getElementById('mainNewsFeed');

            if (articles.length === 0 && totalItemsRendered === 0) {
                feedContainer.innerHTML = `
                    <div class="p-10 text-center text-wireMuted font-mono bg-wireCard border border-wireBorder rounded-2xl">
                        No articles found. Try searching for another topic.
                    </div>`;
                return;
            }

            articles.forEach((article) => {
                const globalIndex = articlesStore.length - articles.length + articles.indexOf(article);
                totalItemsRendered++;

                const card = document.createElement('article');
                card.className = "bg-wireCard border border-wireBorder rounded-2xl p-5 md:p-6 shadow-2xl hover:border-slate-500 transition-all flex flex-col sm:flex-row gap-5 items-stretch cursor-pointer";
                card.onclick = (e) => {
                    // Prevent triggering if user clicks directly on external link
                    if (!e.target.closest('a')) {
                        openArticleReader(globalIndex);
                    }
                };

                const leftBlockHtml = article.image 
                    ? `<div class="w-full sm:w-5/12 h-48 sm:h-auto min-h-[160px] bg-wireBg border border-wireBorder rounded-xl overflow-hidden shrink-0 relative group">
                         <img src="${article.image}" alt="news thumbnail" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.parentElement.outerHTML='<div class=\\'w-full sm:w-5/12 min-h-[160px] bg-wireAd border border-wireBorder rounded-xl flex items-center justify-center font-mono font-black text-4xl text-wireMuted/50 shrink-0\\'>AD</div>'">
                       </div>`
                    : `<div class="w-full sm:w-5/12 min-h-[160px] bg-wireAd border border-wireBorder rounded-xl flex items-center justify-center font-mono font-black text-4xl text-wireMuted/50 shrink-0 select-none">
                        AD
                       </div>`;

                card.innerHTML = `
                    ${leftBlockHtml}
                    <div class="flex flex-col justify-between flex-1 py-1 gap-3">
                        <div>
                            <h2 class="font-mono text-xl md:text-2xl font-bold text-white leading-tight mb-2 hover:text-slate-200 transition-colors">
                                ${article.title}
                            </h2>
                            <p class="font-mono text-xs md:text-sm text-wireText leading-relaxed line-clamp-4">
                                ${article.description || article.content || 'Click read more to read the full story...'}
                            </p>
                        </div>
                        <button onclick="openArticleReader(${globalIndex})" class="self-start text-xs md:text-sm font-mono text-slate-200 hover:text-white underline underline-offset-4 decoration-wireMuted hover:decoration-white transition-all font-semibold">
                            read more
                        </button>
                    </div>
                `;

                feedContainer.appendChild(card);
            });
        }

        // FULL ARTICLE READER MODAL LOGIC
        function openArticleReader(index) {
            const article = articlesStore[index];
            if (!article) return;

            document.getElementById('modalTitle').innerText = article.title;
            
            // Full article content assembly
            const fullText = article.content || article.description || "Full story details are unavailable directly from the feed provider. Click the source link above to read the full story on the publisher's official website.";
            document.getElementById('modalBody').innerText = fullText + "\n\n" + (article.content ? "Article provided via live news aggregation feed." : "");

            document.getElementById('modalExternalLink').href = article.url || "#";

            const imgContainer = document.getElementById('modalImageContainer');
            const imgEl = document.getElementById('modalImage');
            if (article.image) {
                imgEl.src = article.image;
                imgContainer.classList.remove('hidden');
            } else {
                imgContainer.classList.add('hidden');
            }

            document.getElementById('articleModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // Lock background scrolling
        }

        function closeArticleModal() {
            document.getElementById('articleModal').classList.add('hidden');
            document.body.style.overflow = 'auto'; // Unlock background scrolling
        }

        function handleSearchKeypress(e) {
            if (e.key === 'Enter') executeSearch();
        }

        function executeSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                currentSearchQuery = query;
                resetAndReload();
            }
        }

        function clickTrending(topic) {
            document.getElementById('searchInput').value = topic;
            currentSearchQuery = topic;
            resetAndReload();
        }

        function resetFeed() {
            document.getElementById('searchInput').value = '';
            currentSearchQuery = '';
            resetAndReload();
        }

        function resetAndReload() {
            totalItemsRendered = 0;
            articlesStore = [];
            document.getElementById('mainNewsFeed').innerHTML = '';
            loadArticles();
        }

        function getWireframeMockArticles() {
            return [
                {
                    title: "Example news title",
                    description: "Example news content lorum ipmsum sla bla bla bla blab bloah bla yap yap ypa ypa pyap yapppappapapapa",
                    content: "Example news content lorum ipmsum sla bla bla bla blab bloah bla yap yap ypa ypa pyap yapppappapapapa.\n\nAdditional extended content section for full in-app article reading preview mode. Users can scroll freely through the full article without leaving your site.",
                    url: "https://news.google.com",
                    image: null
                },
                {
                    title: "news title 2",
                    description: "Example news content lorum ipmsum sla bla bla bla blab bloah bla yap yap ypa ypa pyap yapppappapapapa",
                    content: "Full news story #2 extended view. Built directly inside the single-file frontend container to give a clean reader experience.",
                    url: "https://news.google.com",
                    image: null
                }
            ];
        }
    </script>
</body>
</html>
